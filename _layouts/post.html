---
layout: default
---

<article class="post">
  <header>
    <p class="eyebrow"><a href="{{ '/' | relative_url }}">Writing</a></p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  {{ content }}
</article>
