name: Build and deploy site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  SITE_BUCKET: ${{ secrets.S3_BUCKET }}
  SITE_URL: ${{ secrets.SITE_URL }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Verify deployment configuration
        run: |
          test -n "$AWS_REGION"
          test -n "$SITE_BUCKET"
          test -n "$SITE_URL"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          case "$SITE_URL" in
            https://*) ;;
            *) echo "SITE_URL must begin with https://" >&2; exit 1 ;;
          esac

      - name: Build Jekyll site
        run: |
          ruby -ryaml -e 'File.write("_config.deploy.yml", { "url" => ENV.fetch("SITE_URL") }.to_yaml)'
          bundle exec jekyll build --config _config.yml,_config.deploy.yml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload site to S3
        run: >-
          aws s3 sync _site "s3://$SITE_BUCKET"
          --delete
          --cache-control 'public,max-age=300'

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths '/*'
